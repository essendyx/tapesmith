# Prüfung bei jedem Push und Pull Request: Web-Oberfläche (Typen, ESLint, Vitest) und Python-Suite.
# Tests, die echte Hardware brauchen (Marker "hardware"), bleiben ohne --hardware übersprungen.
name: CI

on:
  # nur Branches: Tags (v*) testet der Release-Workflow selbst
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-ci.txt

      - name: Python-Pakete
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-ci.txt -e ".[dev]"

      - name: Node.js LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web-Oberfläche prüfen (npm ci, npm run check)
        working-directory: web
        run: |
          npm ci
          npm run check

      - name: Python-Tests
        run: python -m pytest -q -p no:cacheprovider -W error
